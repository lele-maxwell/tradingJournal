# GraphiView Pre-Merge Architectural Review
#
# This workflow runs Graphify's architectural review on pull requests.
# It builds a knowledge graph from the code and uses OpenCode to analyze
# architectural impact and post review comments.
#
# Requirements:
# - Set OPENCODE_GATEWAY_AUDIENCE variable (org-wide for ADORSYS-GIS)
# - Optionally set GRAPHIFY_LLM_API_KEY secret for graph enrichment
#
name: graphify-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: graphify-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Graphify
        run: |
          pip install "graphifyy[mcp,pdf]"
          graphify --version

      - name: 🏗️ Build knowledge graph
        id: build-graph
        run: |
          graphify update .
          if [ -f "graphify-out/graph.json" ]; then
            echo "✅ Graph file created"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Graph file not found"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 📋 Graph stats
        if: steps.build-graph.outputs.success == 'true'
        run: |
          echo "📊 Graph statistics:"
          graphify check-update || true
          echo ""
          echo "📁 Graph file size:"
          ls -lh graphify-out/graph.json

      - name: 🔌 Install OpenCode
        run: |
          # Install OpenCode CLI
          npm install -g @opencode-ai/opencode
          opencode --version

      - name: 📝 Create OpenCode config
        run: |
          mkdir -p .opencode
          cat > .opencode/opencode.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "mcp": {
              "graphify": {
                "type": "local",
                "command": ["graphify-mcp", "graphify-out/graph.json"],
                "enabled": true
              }
            }
          }
          EOF
          echo "✅ OpenCode config created"

      - name: 🔑 Setup OIDC authentication
        if: ${{ vars.OPENCODE_GATEWAY_AUDIENCE != '' }}
        uses: actions/github-script@v7
        env:
          AUDIENCE: ${{ vars.OPENCODE_GATEWAY_AUDIENCE }}
        with:
          script: |
            const token = await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(token);
            core.exportVariable('OPENAI_API_KEY', token);
            core.exportVariable('OPENAI_BASE_URL', 'https://api.ai.camer.digital/v1');
            console.log("✅ OIDC token obtained");

      - name: 🤖 Run Graphify Review
        if: ${{ steps.build-graph.outputs.success == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          # Determine if this is a manual trigger or auto
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Check if comment matches trigger pattern
            if echo "$COMMENT_BODY" | grep -qE '(^|[[:space:]])/(graphify|opencode|oc)\b'; then
              echo "🔍 Manual review triggered"
              TRIGGER_TYPE="manual"
            else
              echo "⏭️ Skipping - not a Graphify trigger"
              exit 0
            fi
          else
            echo "🔍 Auto review triggered"
            TRIGGER_TYPE="auto"
          fi

          # Get changed files
          CHANGED_FILES=$(gh pr view "$PR_NUMBER" --json files -q '.[].path' | tr '\n' ',' | sed 's/,$//')
          echo "📁 Changed files: $CHANGED_FILES"

          # Run OpenCode with Graphify MCP
          opencode run --agent auto-review "
          You are an architectural reviewer. Analyze this PR using Graphify MCP tools.

          Changed files: $CHANGED_FILES

          Steps:
          1. Call mcp.tool('graphify', 'get_pr_impact', {files: ['$CHANGED_FILES'.split(',')].map(f => f.trim())})
          2. Call mcp.tool('graphify', 'god_nodes', {limit: 10})
          3. Call mcp.tool('graphify', 'graph_stats', {})
          4. Call mcp.tool('graphify', 'detect_cycles', {})
          5. Call mcp.tool('graphify', 'get_community', {files: ['$CHANGED_FILES'.split(',')].map(f => f.trim())})

          Then generate a concise architectural review comment in this format:

          ## 📊 GraphiView Architectural Review

          **Overall risk:** 🟢 LOW | 🟡 MEDIUM | 🔴 HIGH

          ### Key Findings
          - Blast radius: X nodes affected
          - God nodes modified: Y
          - Communities touched: Z
          - New circular dependencies: N
          - Layering violations: M

          ### Recommendations
          - [Specific actionable items]

          ---
          *Generated by [GraphiView](https://github.com/lele-maxwell/graphiview)*
          "

      - name: 💬 Post PR Comment
        if: ${{ failure() || success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # Check if we already posted a comment (avoid duplicates)
          EXISTING=$(gh pr view "$PR_NUMBER" --json comments -q '.comments[].body' 2>/dev/null | grep -c "GraphiView Architectural Review" || true)
          if [ "$EXISTING" -eq 0 ]; then
            echo "📝 No existing GraphiView comment found"
          else
            echo "✅ GraphiView comment already exists"
          fi
