# GraphiView Pre-Merge Architectural Review
#
# This workflow runs Graphify's architectural review on pull requests.
# It builds a knowledge graph from the code and analyzes architectural impact.
#
name: graphify-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: graphify-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Graphify
        run: |
          pip install "graphifyy[mcp,pdf]"
          graphify --version

      - name: 🏗️ Build knowledge graph
        id: build-graph
        run: |
          graphify update .
          if [ -f "graphify-out/graph.json" ]; then
            echo "✅ Graph file created"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Graph file not found"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 📋 Graph stats
        if: steps.build-graph.outputs.success == 'true'
        run: |
          echo "📊 Graph statistics:"
          graphify check-update || true
          echo ""
          echo "📁 Graph file size:"
          ls -lh graphify-out/graph.json

      - name: 🤖 Run Graphify Analysis
        if: steps.build-graph.outputs.success == 'true'
        id: analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          # Check if this is a manual trigger
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if echo "$COMMENT_BODY" | grep -qE '(^|[[:space:]])/(graphify|opencode|oc)\b'; then
              echo "🔍 Manual review triggered"
            else
              echo "⏭️ Skipping - not a Graphify trigger"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "🔍 Auto review triggered"
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

          # Get changed files
          CHANGED_FILES=$(gh pr view "$PR_NUMBER" --json files -q '.[].path')
          echo "📁 Changed files:"
          echo "$CHANGED_FILES"
          
          # Run Graphify analysis tools
          echo "📊 Running blast radius analysis..."
          BLAST_RADIUS=$(graphify blast-radius --files $(echo "$CHANGED_FILES" | tr '\n' ' ') 2>/dev/null | tail -1 || echo "0")
          
          echo "📊 Running god nodes analysis..."
          GOD_NODES=$(graphify god-nodes --limit 5 2>/dev/null || echo "None found")
          
          echo "📊 Running cycle detection..."
          CYCLES=$(graphify cycles 2>/dev/null || echo "None found")
          
          echo "📊 Running community detection..."
          COMMUNITIES=$(graphify community 2>/dev/null || echo "Unknown")
          
          echo "📊 Running cohesion analysis..."
          COHESION=$(graphify cohesion 2>/dev/null || echo "Unknown")
          
          # Save results for next step
          echo "blast_radius=$BLAST_RADIUS" >> $GITHUB_OUTPUT
          echo "god_nodes=$GOD_NODES" >> $GITHUB_OUTPUT
          echo "cycles=$CYCLES" >> $GITHUB_OUTPUT
          echo "communities=$COMMUNITIES" >> $GITHUB_OUTPUT
          echo "cohesion=$COHESION" >> $GITHUB_OUTPUT
          echo "changed_files=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: 💬 Post PR Comment
        if: steps.analysis.outputs.skip == 'false' && steps.build-graph.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BLAST_RADIUS: ${{ steps.analysis.outputs.blast_radius }}
          GOD_NODES: ${{ steps.analysis.outputs.god_nodes }}
          CYCLES: ${{ steps.analysis.outputs.cycles }}
          COMMUNITIES: ${{ steps.analysis.outputs.communities }}
          COHESION: ${{ steps.analysis.outputs.cohesion }}
          CHANGED_FILES: ${{ steps.analysis.outputs.changed_files }}
        run: |
          # Check if we already posted a comment
          EXISTING=$(gh pr view "$PR_NUMBER" --json comments -q '.comments[].body' 2>/dev/null | grep -c "GraphiView Architectural Review" || true)
          if [ "$EXISTING" -gt 0 ]; then
            echo "✅ GraphiView comment already exists, skipping"
            exit 0
          fi

          # Determine risk level based on blast radius
          RISK_EMOJI="🟢"
          RISK_LEVEL="LOW"
          if [ "$BLAST_RADIUS" -gt 15 ] 2>/dev/null; then
            RISK_EMOJI="🔴"
            RISK_LEVEL="HIGH"
          elif [ "$BLAST_RADIUS" -gt 5 ] 2>/dev/null; then
            RISK_EMOJI="🟡"
            RISK_LEVEL="MEDIUM"
          fi

          # Build comment
          COMMENT="## 📊 GraphiView Architectural Review

          **Overall risk:** $RISK_EMOJI **$RISK_LEVEL**

          ### Key Findings

          - **Files changed:** $(echo "$CHANGED_FILES" | tr ',' '\n' | wc -l)
          - **Blast radius:** $BLAST_RADIUS nodes affected
          - **God nodes:** $GOD_NODES
          - **Communities:** $COMMUNITIES
          - **Circular dependencies:** $CYCLES
          - **Cohesion:** $COHESION

          ### Recommendations

          - Review the changed files for architectural impact
          - Ensure tests cover the modified areas
          - Consider splitting large PRs into smaller changes

          ---
          *Generated by [GraphiView](https://github.com/lele-maxwell/graphiview)*"

          # Post comment
          echo "$COMMENT" | gh pr comment "$PR_NUMBER" --body-file -
          echo "✅ Comment posted to PR #$PR_NUMBER"
